<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>母线槽.cn 授权完成</title>
<style>
  body{margin:0;background:#f5f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2329}
  .card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:40px 48px;text-align:center;max-width:420px}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:14px;color:#646a73;margin:8px 0;line-height:1.7}
  .ok{color:#34c724;font-size:40px;margin-bottom:8px}
  code{display:inline-block;background:#f0f2f5;border-radius:6px;padding:4px 10px;font-size:12px;color:#3370ff;word-break:break-all;max-width:100%}
</style>
</head>
<body>
<div class="card">
  <div class="ok">✓</div>
  <h1>授权成功</h1>
  <p>已获取授权参数，请关闭本页面，返回豆包对话继续。</p>
  <p>code：<code id="c">读取中…</code></p>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code') || '（未获取到 code，请检查链接）';
  document.getElementById('c').textContent = code;
</script>
</body>
</html>
